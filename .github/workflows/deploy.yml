# Publier l'application sur GitHub Pages.
#
# ---------------------------------------------------------------------------
# À FAIRE UNE FOIS, AVANT QUE CE FICHIER PUISSE FONCTIONNER
# ---------------------------------------------------------------------------
# Settings → Pages → Source : **GitHub Actions**
#
# Ce réglage ne peut pas être posé depuis ici. L'action sait activer Pages
# elle-même (paramètre `enablement`), mais cela exige un jeton d'accès
# personnel à créer et à ranger dans les secrets du dépôt : plus de travail que
# le réglage lui-même, et un secret de plus à surveiller.
#
# Tant que ce réglage n'est pas fait, l'étape « Préparer Pages » échoue avec
# « Get Pages site failed ». Ce n'est pas une erreur de construction : tout ce
# qui précède — installation, lint, types, tests, build — a réussi.
#
# Une fois le réglage posé : Actions → ce workflow → « Run workflow », ou
# n'importe quelle poussée sur main.
#
# Ce qui est publié : le CODE de l'application. Tes données, elles, ne quittent
# jamais ton téléphone — elles vivent dans le stockage de ton navigateur, et
# aucune ligne de ce projet ne les envoie où que ce soit.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer la publication à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les versions v5 de ces actions tournent sur Node 24. Les v4 y étaient
      # forcées par le runner, avec un avertissement de dépréciation à chaque
      # exécution.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les contrôles passent AVANT la publication : une version cassée ne doit
      # jamais atteindre le téléphone.
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test -- --run

      - name: Construire
        # L'adresse d'un site de projet GitHub Pages se termine par le nom du
        # dépôt. Sans ce préfixe, le navigateur chercherait les fichiers à la
        # racine du domaine, où il n'y a rien.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # Ces deux étapes exigent que Pages soit activé (voir en tête de fichier).
      - name: Préparer Pages
        uses: actions/configure-pages@v6
      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
